# Default-deny baseline: no traffic in or out unless explicitly allowed.
# Apply this first, then layer specific allow-rules per workload — starting
# from "deny everything" is the only version of this that's actually safe;
# starting from "allow everything, deny specific things" tends to rot as
# services get added and nobody remembers to add the deny rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: team-example
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Explicit allow: DNS resolution. Without this, the default-deny above
# breaks every workload in the namespace in a way that's confusing to
# debug — pods can't resolve Service names, which looks like a networking
# bug, not a policy one.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: team-example
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Explicit allow: traffic from other pods within the same team namespace.
# Cross-team traffic is denied by default — a service in team-example
# cannot reach a service in a different team's namespace unless that
# namespace explicitly allows it, mirroring the RBAC boundary below.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: team-example
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
